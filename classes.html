<!DOCTYPE html>
<html lang="en">
<head>
<script>document.documentElement.classList.add("pf-auth-pending");</script><style>.pf-auth-pending body{visibility:hidden;}</style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>My Classes - PedaForge</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app-shell.css">
  <style>
    .cls-toolbar { display: flex; align-items: center; gap: 12px; margin: 8px 0 18px; }
    .cls-toolbar .spacer { flex: 1; }

    /* ── Creator card ── */
    .creator {
      background: var(--bg-card); border-radius: var(--radius); padding: 22px 24px;
      box-shadow: 0 1px 2px rgba(45,42,94,0.04), 0 6px 18px rgba(45,42,94,0.06);
      margin-bottom: 22px;
    }
    .creator h3 { font-family: 'Playfair Display', serif; font-size: 1.05rem; color: var(--secondary); margin: 0 0 14px; }
    .creator-grid { display: grid; grid-template-columns: 2fr 1fr 1.4fr auto; gap: 14px; align-items: end; }
    @media (max-width: 900px) { .creator-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 560px) { .creator-grid { grid-template-columns: 1fr; } }
    .field label {
      display: block; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px;
    }
    .field input, .field select {
      width: 100%; padding: 11px 14px; border: 1px solid var(--border);
      border-radius: var(--radius-sm); font-family: var(--font); font-size: 0.9rem; background: #fff;
      min-height: 44px;
    }
    .field input:focus, .field select:focus { outline: none; border-color: var(--primary); }
    .creator .btn { min-height: 44px; }

    /* ── Class cards ── */
    .cls-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; margin: 0 0 60px; }
    .cls-card {
      background: var(--bg-card); border-radius: var(--radius); padding: 22px;
      box-shadow: 0 1px 2px rgba(45,42,94,0.04), 0 6px 18px rgba(45,42,94,0.06);
    }
    .cls-card-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
    .cls-card-head h3 { font-family: 'Playfair Display', serif; font-size: 1.15rem; color: var(--secondary); margin: 0; }
    .cls-meta { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); }
    .kid-list { display: flex; flex-direction: column; gap: 6px; margin: 14px 0; }
    .kid-row {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      background: var(--bg); border-radius: var(--radius-sm); font-size: 0.88rem;
      min-height: 46px;
    }
    .kid-row .kid-face {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      color: #fff; font-size: 0.68rem; font-weight: 800;
    }
    .kid-row a.kid-name { font-weight: 600; color: var(--text); text-decoration: none; }
    .kid-row a.kid-name:hover { color: var(--primary); }
    .kid-tagsum {
      font-size: 0.7rem; font-weight: 600; color: var(--text-muted);
      background: #fff; border: 1px solid var(--border); border-radius: 100px;
      padding: 3px 11px; cursor: pointer; white-space: nowrap;
    }
    .kid-tagsum:hover { border-color: var(--primary); color: var(--primary); }
    .kid-row .kid-del {
      margin-left: auto; border: none; background: none; cursor: pointer;
      color: var(--text-muted); font-size: 0.85rem; width: 34px; height: 34px; border-radius: 10px;
    }
    .kid-row .kid-del:hover { color: var(--danger); background: rgba(220,38,38,0.06); }

    /* ── Add child (collapsed by default) ── */
    .add-kid-toggle {
      width: 100%; min-height: 44px; border: 1px dashed var(--border); border-radius: var(--radius-sm);
      background: none; cursor: pointer; font-family: var(--font); font-size: 0.85rem; font-weight: 600;
      color: var(--text-muted); display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .add-kid-toggle:hover { border-color: var(--primary); color: var(--primary); }
    .add-kid { display: none; flex-direction: column; gap: 10px; border-top: 1px dashed var(--border); padding-top: 14px; margin-top: 12px; }
    .add-kid.open { display: flex; }
    .add-kid input {
      padding: 11px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-family: var(--font); font-size: 0.88rem; min-height: 44px;
    }

    /* ── Tag editor popover ── */
    .tag-pop {
      position: absolute; z-index: 90; background: var(--bg-card); border-radius: 16px;
      box-shadow: 0 4px 10px rgba(45,42,94,0.1), 0 18px 50px rgba(45,42,94,0.22);
      padding: 16px; width: 300px;
    }
    .tag-pop h4 { font-size: 0.8rem; color: var(--secondary); margin: 0 0 10px; }
    .tag-picks { display: flex; gap: 7px; flex-wrap: wrap; }
    .tag-pick {
      font-size: 0.74rem; font-weight: 600; padding: 8px 14px; min-height: 36px;
      border-radius: 100px; border: 1px solid var(--border); background: var(--bg); cursor: pointer;
      font-family: var(--font);
    }
    .tag-pick.on { background: rgba(232,6,60,0.08); border-color: var(--primary); color: var(--primary); }

    /* ── Table view ── */
    .cls-table-wrap {
      background: var(--bg-card); border-radius: var(--radius); overflow: hidden;
      box-shadow: 0 1px 2px rgba(45,42,94,0.04), 0 6px 18px rgba(45,42,94,0.06);
      margin-bottom: 60px; display: none;
    }
    .cls-table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
    .cls-table th {
      text-align: left; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--text-muted);
      padding: 14px 18px; border-bottom: 1px solid var(--border); background: var(--bg);
    }
    .cls-table td { padding: 12px 18px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .cls-table tr:last-child td { border-bottom: none; }
    .cls-table tr:hover td { background: #fdfbf7; }
    .empty-note { color: var(--text-muted); font-style: italic; font-size: 0.85rem; }
    body.view-table .cls-grid { display: none; }
    body.view-table .cls-table-wrap { display: block; }
  </style>
</head>
<body>
  <header class="page-header">
    <div class="container">
      <h1>My Classes</h1>
      <p>Create your classes and add children with their learning profiles. Every module - lesson planning, portfolios, reading, benchmarks - attaches to the children you add here.</p>
    </div>
  </header>

  <main class="container" style="padding-bottom:60px;">
    <div class="creator">
      <h3>Create a class</h3>
      <div class="creator-grid">
        <div class="field">
          <label for="ncName">Class name</label>
          <input type="text" id="ncName" placeholder="e.g. K1 Sunshine" maxlength="60">
        </div>
        <div class="field">
          <label for="ncAge">Age group</label>
          <select id="ncAge">
            <option value="ic">Infant Care</option><option value="pg">Playgroup</option>
            <option value="n1">Nursery 1</option><option value="n2">Nursery 2</option>
            <option value="k1" selected>Kindergarten 1</option><option value="k2">Kindergarten 2</option>
          </select>
        </div>
        <div class="field">
          <label for="ncCentre">Centre</label>
          <select id="ncCentre"></select>
        </div>
        <button class="btn btn-primary" id="ncBtn">Create Class</button>
      </div>
    </div>

    <div class="cls-toolbar">
      <span class="empty-note" id="clsCount"></span>
      <span class="spacer"></span>
      <div class="pf-viewseg" role="tablist" aria-label="View">
        <button id="viewCards" class="on" role="tab" aria-selected="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          Cards
        </button>
        <button id="viewTable" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          Table
        </button>
      </div>
    </div>

    <div class="cls-grid" id="clsGrid"><span class="empty-note">Loading...</span></div>

    <div class="cls-table-wrap">
      <table class="cls-table" id="clsTable">
        <thead><tr><th>Child</th><th>Class</th><th>Age group</th><th>Learning profile</th><th style="width:60px;"></th></tr></thead>
        <tbody id="clsTableBody"></tbody>
      </table>
    </div>
  </main>

  <footer class="footer"><div class="container"><div class="footer-bottom">
    <span>PedaForge</span>
    <div class="footer-badges"><span class="footer-badge">PDPA Compliant</span><span class="footer-badge">SG Data Residency</span></div>
  </div></div></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/pf-auth.js"></script>
  <script src="js/pf-api.js"></script>
  <script src="js/pf-markdown.js"></script>
  <script src="js/pf-shell.js"></script>
  <script src="js/pf-centres.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pf-classes.js"></script>
</body>
</html>
